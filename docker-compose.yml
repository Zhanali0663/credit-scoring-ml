services:
  app:
    build: .
    container_name: credit-scoring-app
    ports:
      - "8501:8501"
    volumes:
      # Reuse artifacts produced on the host; never bake 200 MB models into git.
      - ./models_artifacts:/app/models_artifacts:ro
      - ./reports:/app/reports:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

  training:
    build: .
    container_name: credit-scoring-train
    volumes:
      - ./data:/app/data
      - ./models_artifacts:/app/models_artifacts
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m src.utils.pipeline
